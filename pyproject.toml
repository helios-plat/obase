[project]
name = "obase"
version = "0.28.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
    "structlog>=24.0",
    "argon2-cffi>=23.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "pyotp>=2.9",
    "qrcode>=7.4",
    "Pillow>=10.0",
    "mcp>=1.27",
    "rapidfuzz>=3.0",
    "httpx>=0.27",
    "asyncpg>=0.29",
    "pgvector>=0.3",
]

[project.optional-dependencies]
migration = [
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]
tts = [
    "edge-tts>=6.1",
]
docker = [
    "docker>=7.0",
]
cache = [
    "redis>=4.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
    "types-pyjwt",
    "types-qrcode",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
import_mode = "importlib"

[tool.coverage.run]
source = ["obase"]
omit = ["tests/*"]
